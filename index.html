<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bizim Defterimiz</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}


body{

    min-height:100vh;

    background:
    radial-gradient(circle at top,#6376a8,#182033 70%);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:#fff8f2;

}



.container{

    width:100%;

    max-width:430px;

    background:rgba(255,240,230,.12);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:32px;

    padding:32px 25px;

    box-shadow:
    0 25px 70px rgba(0,0,0,.35);

}



.title{

    text-align:center;

    font-size:32px;

    margin-bottom:8px;

    color:#fff7ef;

}



.subtitle{

    text-align:center;

    font-size:15px;

    color:#e8ddd5;

    margin-bottom:30px;

}



input,
textarea{

    width:100%;

    padding:16px;

    margin-bottom:15px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.2);

    outline:none;

    background:rgba(255,255,255,.14);

    color:white;

    font-size:16px;

}



input::placeholder,
textarea::placeholder{

    color:#ddd2cb;

}



button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:22px;

    background:linear-gradient(
        135deg,
        #efa6bb,
        #d77f99
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:translateY(-3px);

}



.hidden{

    display:none;

}



#notesList{

    margin-top:25px;

}



.note{

    background:rgba(255,240,230,.15);

    border-radius:22px;

    padding:18px;

    margin-bottom:15px;

    border-left:4px solid #efa6bb;

    animation:fade .4s ease;

    word-wrap:break-word;

}



.noteDate{

    margin-top:10px;

    font-size:12px;

    opacity:.7;

}



@keyframes fade{

    from{

        opacity:0;

        transform:translateY(10px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}



.logout{

    margin-top:15px;

    background:#59627d;

}



@media(max-width:500px){

    body{

        padding:12px;

    }


    .container{

        padding:25px 18px;

    }


    .title{

        font-size:27px;

    }


}



</style>


</head>


<body>


<div class="container">


<h1 class="title">
🤍 Bizim Defterimiz
</h1>


<p class="subtitle">
Bazı şeyler unutulmaz, sadece saklanır...
</p>



<div id="passwordBox">


<input
type="password"
id="passwordInput"
placeholder="Şifre">


<button id="loginBtn">
Giriş Yap
</button>


</div>




<div id="notesBox" class="hidden">


<textarea
id="noteInput"
rows="5"
placeholder="Buraya bir şey bırak..."></textarea>


<button id="saveBtn">
Notu Kaydet
</button>


<div id="notesList">

</div>


<button
id="logoutBtn"
class="logout">

Çıkış Yap

</button>


</div>
<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy
}
from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




// Firebase ayarları

const firebaseConfig = {

apiKey: "AIzaSyDFKMr27HtRccTHuCufj2TNj06M4flboZM",

authDomain: "bizim-defterimiz-c26ab.firebaseapp.com",

projectId: "bizim-defterimiz-c26ab",

storageBucket: "bizim-defterimiz-c26ab.firebasestorage.app",

messagingSenderId: "876426650286",

appId: "1:876426650286:web:eaa183800551d00338433f"

};




// Firebase başlat

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





// Elemanlar

const passwordBox = document.getElementById("passwordBox");

const notesBox = document.getElementById("notesBox");

const passwordInput = document.getElementById("passwordInput");

const loginBtn = document.getElementById("loginBtn");

const noteInput = document.getElementById("noteInput");

const saveBtn = document.getElementById("saveBtn");

const notesList = document.getElementById("notesList");

const logoutBtn = document.getElementById("logoutBtn");





// Şifre

const dogruSifre = "1234";





// Giriş

loginBtn.addEventListener("click",()=>{


    if(passwordInput.value === dogruSifre){


        passwordBox.classList.add("hidden");

        notesBox.classList.remove("hidden");

        loadNotes();


    }

    else{


        alert("Şifre yanlış 🤍");


    }


});







// Not kaydetme

saveBtn.addEventListener("click", async()=>{


    const text = noteInput.value.trim();



    if(text === ""){


        alert("Önce bir şey yaz 🤍");

        return;


    }



    try{


        await addDoc(collection(db,"notes"),{


            text:text,

            date:new Date().toLocaleString("tr-TR")


        });



        noteInput.value="";


        loadNotes();



    }


    catch(error){


        console.log(error);

        alert("Not kaydedilemedi");


    }



});







// Notları yükleme

async function loadNotes(){


    notesList.innerHTML="";



    const q = query(

        collection(db,"notes"),

        orderBy("date","desc")

    );



    const snapshot = await getDocs(q);



    snapshot.forEach((doc)=>{


        const data = doc.data();



        const note = document.createElement("div");


        note.className="note";



        note.innerHTML = `

        ${data.text}

        <div class="noteDate">

        ${data.date}

        </div>

        `;



        notesList.appendChild(note);



    });



}







// Çıkış

logoutBtn.addEventListener("click",()=>{


    notesBox.classList.add("hidden");


    passwordBox.classList.remove("hidden");


    passwordInput.value="";


});





</script>


</body>

</html>
